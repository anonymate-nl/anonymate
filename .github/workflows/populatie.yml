name: populatie

# Maandelijks de publieke bronnen ophalen, de populatie bouwen en er datapakketten van maken
# (kladbloknotitie 13).
#
# Hitte-eiland: `anonymate ingest uhi` haalt de tabel per postcode op (RIVM-kaart van 10 m, CC
# Publiek Domein, woninggewogen gemiddeld over de BAG-adrespunten) uit de release 'bronnen-cache':
# een download van 3 MB.
#
# Ritme: op de 10e om 03:17 UTC. Dan zijn het EP-online-totaalbestand (de 1e, rond 03:00) en de
# BAG van PDOK (rond de 8e) van dezelfde maand er allebei, met marge; een ongewone minuut, omdat
# GitHub geplande runs op het hele uur vaak vertraagt. De 3D-BAG verschijnt een paar keer per jaar:
# die wordt alleen opnieuw ingelezen bij een nieuwe versie; de compacte tabel van de vorige keer
# staat bij de release 'bronnen-cache'. Gemeenten veranderen per 1 januari; ze worden elke keer
# opnieuw opgehaald (klein).
#
# EP-online wordt wél opgehaald en gebruikt voor de populatie, maar gaat in geen enkel pakket mee:
# `anonymate pakketten` laat het label, de labelgegevens en elke signatuur die ze gebruikt weg,
# tot RVO heeft bevestigd wat mag. De pakketten worden als release-assets gepubliceerd, zodat
# iedereen ze zonder account kan downloaden: de vaste pre-release 'datapakket' (assets elke
# maand vervangen, vaste URL) en een maandkopie 'datapakket-JJJJ-MM'. Het artefact blijft
# 14 dagen bewaard als reserve.
#
# Kosten: voor een openbare repository zijn GitHub-runners gratis. Een job mag hoogstens 6 uur
# duren; zonder nieuwe 3D-BAG kost een run naar schatting 2 tot 3 uur, met een nieuwe 3D-BAG
# daar ruim 4 uur bij (nog niet gemeten op GitHub). GitHub zet geplande runs in een openbare
# repository uit na 60 dagen zonder activiteit; de laatste stap zet de workflow daarom weer aan.
on:
  schedule:
    - cron: "17 3 10 * *"
  workflow_dispatch:

permissions:
  contents: write   # releases 'bronnen-cache', 'datapakket' en 'datapakket-JJJJ-MM' bijwerken
  actions: write    # de workflow actief houden

concurrency:
  group: populatie
  cancel-in-progress: false

jobs:
  populatie:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      EPONLINE_API_KEY: ${{ secrets.EPONLINE_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Schijfruimte vrijmaken (BAG ~8 GB, 3D-BAG per tegel)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Opslag in de tijdelijke map van de runner
        run: |
          echo "ANONYMATE_HOME=$RUNNER_TEMP/store" >> "$GITHUB_ENV"
          echo "ANONYMATE_DOWNLOADS=$RUNNER_TEMP/downloads" >> "$GITHUB_ENV"
      - name: Gemeenten, KNMI-stations en BAG
        run: |
          anonymate ingest gebieden
          anonymate ingest knmi
          anonymate ingest bag
      - name: EP-online (alleen voor de populatie; niet in de pakketten)
        if: env.EPONLINE_API_KEY != ''
        run: anonymate ingest ep-online
      - name: 3D-BAG uit de vorige run, of opnieuw bij een nieuwe versie
        run: |
          VERSIE=$(python -c "from anonymate.store import THREEDBAG_VERSION as v; print(v)")
          mkdir -p "$ANONYMATE_HOME/raw"
          if gh release download bronnen-cache -p "3dbag-$VERSIE.parquet" -D "$RUNNER_TEMP" 2>/dev/null; then
            cp "$RUNNER_TEMP/3dbag-$VERSIE.parquet" "$ANONYMATE_HOME/raw/3dbag.parquet"
            python -c "
          import pyarrow.parquet as pq
          from anonymate.store import Store, THREEDBAG_VERSION
          s = Store.open()
          n = pq.ParquetFile(s.raw / '3dbag.parquet').metadata.num_rows
          s.record('3dbag', version=THREEDBAG_VERSION + ' (uit bronnen-cache)', rows=n)"
          else
            anonymate ingest 3dbag --tegels-weggooien
            cp "$ANONYMATE_HOME/raw/3dbag.parquet" "$RUNNER_TEMP/3dbag-$VERSIE.parquet"
            gh release view bronnen-cache >/dev/null 2>&1 || gh release create bronnen-cache \
              --prerelease --title "bronnen-cache" \
              --notes "Tussenresultaten van de maandelijkse run (3D-BAG per pand, CC BY 4.0). Geen EP-online."
            gh release upload bronnen-cache "$RUNNER_TEMP/3dbag-$VERSIE.parquet" --clobber
          fi
      - name: Hitte-eiland per postcode (RIVM, uit de release bronnen-cache)
        run: anonymate ingest uhi
      - name: Populatie bouwen
        run: anonymate build
      - name: Datapakketten (zonder EP-online)
        run: |
          anonymate pakketten --uit pakketten --publicatie publicatie
          cat publicatie/manifest.json
          ls -l publicatie
          anonymate status
      - name: Datapakket publiceren als release (zonder account te downloaden)
        run: |
          MAAND=$(date -u +%Y-%m)
          ZIP=publicatie/anonymate-datapakket.zip
          SHA=$(python -c "import json; print(json.load(open('publicatie/manifest.json'))['zip']['sha256'])")
          MB=$(( $(stat -c %s "$ZIP") / 1000000 ))
          python - > notities.md <<'PY'
          import json
          m = json.load(open("publicatie/manifest.json", encoding="utf-8"))
          print(f"Datapakket van {m['gemaakt'][:10]}, zonder EP-online ({m['woningen']:,} woningen).".replace(",", "."))
          print()
          print("Bronnen en versies:")
          for k, v in m["bronnen"].items():
              print(f"- {k}: {v}")
          print()
          print(f"anonymate-datapakket.zip: {m['zip']['bytes'] / 1e6:.0f} MB")
          print()
          print(f"sha256: {m['zip']['sha256']}")
          print()
          print("Installeren: `anonymate ingest pakket` (downloadt en controleert dit pakket).")
          PY
          for TAG in datapakket "datapakket-$MAAND"; do
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG"               --prerelease --title "$TAG" --notes-file notities.md
            gh release edit "$TAG" --notes-file notities.md
            gh release upload "$TAG" "$ZIP" publicatie/manifest.json --clobber
          done
          echo "$MB MB, sha256 $SHA"
      - name: Webpopulatie voor anonymate.nl/app (uit het datapakket, dus zonder EP-online)
        # dezelfde populatie die 'anonymate ingest pakket' maakt zonder eigen EP-online, zonder de
        # kolommen die zonder labels kopieen zijn, in stukken < 100 MB (anonymate.webpopulatie);
        # pages.yml zet ze naast de app. Een eigen opslag, zodat EP-online er zeker niet in komt.
        run: |
          WEB="$RUNNER_TEMP/webstore"
          mkdir -p "$WEB/raw"
          cp "$ANONYMATE_HOME/raw/knmi_stations.parquet" "$WEB/raw/"
          ANONYMATE_HOME="$WEB" python -c "
          from anonymate import datapakket
          from anonymate.store import Store
          datapakket.install('publicatie/anonymate-datapakket.zip', Store.open(), progress=print)"
          python -m anonymate.webpopulatie "$WEB/population.parquet" webpopulatie \
            --bronnen publicatie/manifest.json
          ls -l webpopulatie
          MAAND=$(date -u +%Y-%m)
          for TAG in datapakket "datapakket-$MAAND"; do
            gh release upload "$TAG" webpopulatie/* --clobber
          done
      - name: Site opnieuw bouwen met de nieuwe webpopulatie
        run: gh workflow run pages.yml --ref main
      - uses: actions/upload-artifact@v4
        with:
          name: datapakketten
          path: pakketten
          retention-days: 14
      - name: Workflow actief houden (GitHub zet hem anders na 60 dagen stil uit)
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/populatie.yml/enable"
