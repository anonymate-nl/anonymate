name: pages

# anonymate.nl op GitHub Pages: de landingspagina (website/) op https://anonymate.nl, en het
# prototype van de webversie (web/, docs/werk/webversie.md) op https://anonymate.nl/app/. De
# landingspagina linkt nog niet naar /app/. Het prototype wordt gebouwd met web/maak.py (de pagina,
# de schil, de worker, de wheel van anonymate en Pyodide zelf, met manifest.json); de rest is statisch.
on:
  push:
    branches: [main]
    paths: ["website/**", "web/**", "src/**", "pyproject.toml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Pyodide-bestanden uit de cache (maak.py downloadt ze anders en controleert de hashes)
        uses: actions/cache@v4
        with:
          path: web/.pyodide-cache
          key: pyodide-${{ hashFiles('web/pyodide-sha256.json') }}
      - name: anonymate installeren (maak.py schrijft de oefenpopulatie)
        run: pip install -e .
      - name: Site samenstellen (landingspagina + prototype onder /app/)
        run: |
          python web/maak.py
          mkdir -p _site
          cp -r website/. _site/
          cp -r web/dist _site/app
          ls -la _site _site/app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
