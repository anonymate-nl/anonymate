name: release

# A version tag (v0.1.0, ...) builds a standalone Windows program (no Python needed) and attaches
# it, together with the Python wheel, to a GitHub release. Started by hand (workflow_dispatch) it
# only builds: the zip is attached to the run as an artifact, for testing, and nothing is released.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[gui]" pyinstaller build
      - name: Build GUI and CLI
        run: |
          pyinstaller --noconfirm --onedir --windowed --name anonymate-gui `
            --collect-all duckdb --collect-all h3 --collect-data anonymate packaging/gui_entry.py
          pyinstaller --noconfirm --onedir --console --name anonymate `
            --collect-all duckdb --collect-all h3 --collect-data anonymate packaging/cli_entry.py
          Copy-Item -Recurse dist/anonymate/* dist/anonymate-gui/ -Force
          Copy-Item LICENSE, README.md dist/anonymate-gui/
          if (Test-Path docs/voorbeeld/woningen.csv) { Copy-Item docs/voorbeeld/woningen.csv, docs/voorbeeld/weer.csv dist/anonymate-gui/ }
          Compress-Archive dist/anonymate-gui/* anonymate-windows.zip
      - name: Smoke test
        run: |
          dist/anonymate-gui/anonymate.exe --version
          if (Test-Path dist/anonymate-gui/woningen.csv) {
            dist/anonymate-gui/anonymate.exe detect dist/anonymate-gui/woningen.csv
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: anonymate-windows
          path: anonymate-windows.zip
      - run: python -m build
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            anonymate-windows.zip
            dist/*.whl
            dist/*.tar.gz
