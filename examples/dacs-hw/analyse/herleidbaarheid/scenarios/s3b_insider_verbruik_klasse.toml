# Insider: het verbruik jan-mrt 2025 afgerond op klassen van 50 m3 gas en 250 kWh stroom.
dataset = "../uitvoer/dacs_hw_woningen.csv"
p = 0.09
auto = false
weglaten = ["custom_id__str"]
scenario = "insider"

[afbakening]
woonplaats = ["Dalen"]
gemeente = ["Coevorden"]
bouwjaar = "1959-1994"

[qids]
gemeente__cat = "gemeente"
gas_kw1_klasse__m3 = "jaarverbruik"
elektra_kw1_klasse__kWh = "jaarverbruik"
