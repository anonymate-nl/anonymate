[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anonymate"
version = "0.1.0rc1"
description = "Herleidbaarheidstoets voor woning- en energiedata tegen de volledige Nederlandse woningvoorraad, lokaal en offline / Re-identification risk assessment for Dutch dwelling and energy data"
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE"]
authors = [{ name = "Henri ter Hofte" }]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "h3>=4",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Natural Language :: Dutch",
    "Natural Language :: English",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8"]
# alleen voor `anonymate ingest uhi --raster` (het hitte-eiland per woning uit de RIVM-kaart)
uhi = ["rasterio>=1.3"]
# alleen voor docs/kaarten/maak_kaarten.py
kaarten = ["matplotlib>=3.8", "shapely>=2.0"]

[project.scripts]
anonymate = "anonymate.cli:main"

[project.gui-scripts]
anonymate-gui = "anonymate.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # tests share helpers (from tests.test_publicatie import ...)

[tool.setuptools.package-data]
anonymate = ["data/*.json", "data/voorbeeld/*", "data/kaart/*", "data/zoneinfo/Europe/*"]
